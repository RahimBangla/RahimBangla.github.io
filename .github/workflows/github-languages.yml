name: Update GitHub language stats

on:
  schedule:
    - cron: "17 3 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sum language bytes across public repos
        run: node .github/scripts/github-languages.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-languages.json
          git diff --cached --quiet || { git commit -m "Update GitHub language stats"; git push; }
